<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070a" />
    <title>ACT54SIDE · Unity Entry Animation</title>
    <link rel="stylesheet" href="./styles.css?v=assets-layout-1" />
  </head>
  <body>
    <main id="stage-scaler" aria-label="ACT54SIDE 开场动画，逻辑分辨率 1920 × 1080">
      <div id="stage"></div>
      <div id="reference-hud" aria-hidden="true">
        <div class="reference-topmenu">
          <span class="reference-back"><svg viewBox="0 0 40 52"><path d="M30 5 9 26 30 47"/></svg></span>
          <span class="reference-home"><svg viewBox="0 0 52 48"><path d="m4 23 22-19 22 19M12 20v23h10V31h8v12h10V20"/></svg></span>
        </div>
        <span class="reference-shop-count">33</span>
        <span class="reference-event-time">作战结束时间 2026/09/18 03:59 <em>剩余3天</em></span>
      </div>
    </main>

    <div id="loading" role="status">正在载入 ACT54SIDE 动画资源…</div>
    <button id="audio-toggle" type="button" aria-pressed="false">解除静音</button>

    <section id="controls" aria-label="动画控制">
      <button id="replay" type="button" title="重播（R）">重播</button>
      <button id="frame-back" type="button" title="上一帧（←）">−1</button>
      <button id="play" type="button" title="播放或暂停（空格）">播放</button>
      <button id="frame-forward" type="button" title="下一帧（→）">+1</button>
      <input id="timeline" type="range" min="0" value="0" aria-label="动画帧" />
      <output id="time-label">000 / 390 · 0.00s</output>
    </section>

    <script type="module" src="./app.js?v=assets-layout-1"></script>
  </body>
</html>
